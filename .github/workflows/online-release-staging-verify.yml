name: online-release-staging-verify

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA or unique short commit SHA whose staging deploy should be verified
        required: true
        type: string
      frontend_url:
        description: Staging frontend URL
        required: false
        default: https://staging.ai-arena.pages.dev
        type: string
      backend_url:
        description: Staging backend URL
        required: false
        default: https://ai-arena-staging-p4ml.onrender.com
        type: string
      reversi_game_url:
        description: Exact Reversi game bundle release URL
        required: false
        default: https://github.com/yoskeoka/reversi-ai-arena/releases/download/v0.1.0/reversi-game-v0.1.0.arena.zip
        type: string
      reversi_game_sha256:
        description: SHA-256 for the exact Reversi game bundle release asset
        required: false
        default: 98bd46609016dc763bcbfff747c6705c7f1608a86d164d77b38db208d0d1c0df
        type: string
      reversi_ai_url:
        description: Exact Reversi AI bundle release URL
        required: false
        default: https://github.com/yoskeoka/reversi-ai-arena/releases/download/v0.1.0/reversi-rust-reference-ai-v0.1.0.arena.zip
        type: string
      reversi_ai_sha256:
        description: SHA-256 for the exact Reversi AI bundle release asset
        required: false
        default: 15ec6133f92002f68f291b39df69ac9beeb177debc93dd1d9c725c77db042326
        type: string
  workflow_run:
    workflows:
      - online-release-staging
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      should_verify: ${{ steps.prepare.outputs.should_verify }}
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      frontend_url: ${{ steps.prepare.outputs.frontend_url }}
      backend_url: ${{ steps.prepare.outputs.backend_url }}
      reversi_game_url: ${{ steps.prepare.outputs.reversi_game_url }}
      reversi_game_sha256: ${{ steps.prepare.outputs.reversi_game_sha256 }}
      reversi_ai_url: ${{ steps.prepare.outputs.reversi_ai_url }}
      reversi_ai_sha256: ${{ steps.prepare.outputs.reversi_ai_sha256 }}
    steps:
      - name: Evaluate staging verification trigger
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const resolveDispatchedSha = async (rawRef) => {
              const candidate = rawRef.trim();
              if (!/^[0-9a-f]{7,40}$/i.test(candidate)) {
                core.setFailed("commit_sha must be a full SHA or a unique short SHA using 7-40 hexadecimal characters.");
                return null;
              }

              try {
                const { data } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: candidate,
                });
                return data.sha;
              } catch (error) {
                core.setFailed(`commit_sha '${candidate}' could not be resolved. Use a full SHA or a unique short SHA on this repository.`);
                return null;
              }
            };

            if (context.eventName === "workflow_dispatch") {
              const inputs = context.payload.inputs ?? {};
              const targetSha = await resolveDispatchedSha(inputs.commit_sha ?? "");
              if (!targetSha) {
                return;
              }
              core.setOutput("should_verify", "true");
              core.setOutput("target_sha", targetSha);
              core.setOutput("frontend_url", inputs.frontend_url ?? "");
              core.setOutput("backend_url", inputs.backend_url ?? "");
              core.setOutput("reversi_game_url", inputs.reversi_game_url ?? "");
              core.setOutput("reversi_game_sha256", inputs.reversi_game_sha256 ?? "");
              core.setOutput("reversi_ai_url", inputs.reversi_ai_url ?? "");
              core.setOutput("reversi_ai_sha256", inputs.reversi_ai_sha256 ?? "");
              core.info(`resolved workflow_dispatch commit_sha to ${targetSha}`);
              return;
            }

            const upstream = context.payload.workflow_run;
            core.setOutput("target_sha", upstream.head_sha);

            if (upstream.conclusion !== "success") {
              core.setOutput("should_verify", "false");
              return;
            }

            core.setOutput("should_verify", "true");
            core.setOutput("frontend_url", "https://staging.ai-arena.pages.dev");
            core.setOutput("backend_url", "https://ai-arena-staging-p4ml.onrender.com");
            core.setOutput("reversi_game_url", "https://github.com/yoskeoka/reversi-ai-arena/releases/download/v0.1.0/reversi-game-v0.1.0.arena.zip");
            core.setOutput("reversi_game_sha256", "98bd46609016dc763bcbfff747c6705c7f1608a86d164d77b38db208d0d1c0df");
            core.setOutput("reversi_ai_url", "https://github.com/yoskeoka/reversi-ai-arena/releases/download/v0.1.0/reversi-rust-reference-ai-v0.1.0.arena.zip");
            core.setOutput("reversi_ai_sha256", "15ec6133f92002f68f291b39df69ac9beeb177debc93dd1d9c725c77db042326");

  verify-staging:
    needs: prepare
    if: needs.prepare.outputs.should_verify == 'true'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --ipc=host
    concurrency:
      group: online-release-staging-verify-${{ needs.prepare.outputs.target_sha }}
      cancel-in-progress: false
    steps:
      - name: Checkout target commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: operator-ui/pnpm-lock.yaml

      - name: Install operator UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: operator-ui

      - name: Download and verify exact Reversi release assets
        run: |
          mkdir -p "$RUNNER_TEMP/reversi-release"
          game_asset="${REVERSI_GAME_URL##*/}"
          ai_asset="${REVERSI_AI_URL##*/}"
          release_base="${REVERSI_GAME_URL%/*}"
          curl --fail --location --silent --show-error "$REVERSI_GAME_URL" --output "$RUNNER_TEMP/reversi-release/$game_asset"
          curl --fail --location --silent --show-error "$REVERSI_AI_URL" --output "$RUNNER_TEMP/reversi-release/$ai_asset"
          curl --fail --location --silent --show-error "$release_base/SHA256SUMS" --output "$RUNNER_TEMP/reversi-release/SHA256SUMS"
          (
            cd "$RUNNER_TEMP/reversi-release"
            sha256sum --check --status SHA256SUMS
            echo "$REVERSI_GAME_SHA256  $game_asset" | sha256sum --check --status
            echo "$REVERSI_AI_SHA256  $ai_asset" | sha256sum --check --status
          )
        env:
          REVERSI_GAME_URL: ${{ needs.prepare.outputs.reversi_game_url }}
          REVERSI_GAME_SHA256: ${{ needs.prepare.outputs.reversi_game_sha256 }}
          REVERSI_AI_URL: ${{ needs.prepare.outputs.reversi_ai_url }}
          REVERSI_AI_SHA256: ${{ needs.prepare.outputs.reversi_ai_sha256 }}

      - name: Verify remote staging operator flow
        run: pnpm run verify:remote
        working-directory: operator-ui
        env:
          CI: "true"
          OPERATOR_UI_BASE_URL: ${{ needs.prepare.outputs.frontend_url }}
          OPERATOR_UI_BACKEND_BASE_URL: ${{ needs.prepare.outputs.backend_url }}
          OPERATOR_UI_REVERSI_GAME_BUNDLE: ${{ runner.temp }}/reversi-release/reversi-game-v0.1.0.arena.zip
          OPERATOR_UI_REVERSI_GAME_SHA256: ${{ needs.prepare.outputs.reversi_game_sha256 }}
          OPERATOR_UI_REVERSI_AI_BUNDLE: ${{ runner.temp }}/reversi-release/reversi-rust-reference-ai-v0.1.0.arena.zip
          OPERATOR_UI_REVERSI_AI_SHA256: ${{ needs.prepare.outputs.reversi_ai_sha256 }}

      - name: Upload staging verification artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: online-release-staging-verify
          path: |
            operator-ui/test-results/remote
            operator-ui/playwright-report/remote
          if-no-files-found: ignore

      - name: Write workflow summary
        if: always()
        run: |
          {
            echo "## Staging verification"
            echo
            echo "- Commit SHA: \`${TARGET_SHA}\`"
            echo "- Frontend URL: ${FRONTEND_URL}"
            echo "- Backend URL: ${BACKEND_URL}"
            echo "- Reversi game: ${REVERSI_GAME_URL} (sha256:${REVERSI_GAME_SHA256})"
            echo "- Reversi AI: ${REVERSI_AI_URL} (sha256:${REVERSI_AI_SHA256})"
            echo "- Artifact: GitHub Actions artifact \`online-release-staging-verify\`"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          FRONTEND_URL: ${{ needs.prepare.outputs.frontend_url }}
          BACKEND_URL: ${{ needs.prepare.outputs.backend_url }}
          REVERSI_GAME_URL: ${{ needs.prepare.outputs.reversi_game_url }}
          REVERSI_GAME_SHA256: ${{ needs.prepare.outputs.reversi_game_sha256 }}
          REVERSI_AI_URL: ${{ needs.prepare.outputs.reversi_ai_url }}
          REVERSI_AI_SHA256: ${{ needs.prepare.outputs.reversi_ai_sha256 }}
