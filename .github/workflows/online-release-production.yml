name: online-release-production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full commit SHA or unique short commit SHA verified on staging and promoted to production
        required: true
        type: string
      staging_verification_run_url:
        description: URL of the staging verification workflow run
        required: false
        type: string
      previous_commit_sha:
        description: Required only for a legacy backend without /version; full reachable SHA to use for one rollback attempt
        required: false
        type: string
  push:
    tags:
      - "*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CLOUDFLARE_PAGES_PROJECT: ai-arena
  PRODUCTION_FRONTEND_URL: https://ai-arena.pages.dev
  PRODUCTION_BACKEND_URL: https://ai-arena-service.onrender.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      target_sha: ${{ steps.prepare.outputs.target_sha }}
      verification_url: ${{ steps.prepare.outputs.verification_url }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
    steps:
      - name: Prepare production release inputs
        id: prepare
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const resolveDispatchedSha = async (rawRef) => {
              const candidate = rawRef.trim();
              if (!/^[0-9a-f]{7,40}$/i.test(candidate)) {
                core.setFailed("commit_sha must be a full SHA or a unique short SHA using 7-40 hexadecimal characters.");
                return null;
              }

              try {
                const { data } = await github.rest.repos.getCommit({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: candidate,
                });
                return data.sha;
              } catch (error) {
                core.setFailed(`commit_sha '${candidate}' could not be resolved. Use a full SHA or a unique short SHA on this repository.`);
                return null;
              }
            };

            if (context.eventName === "workflow_dispatch") {
              const inputs = context.payload.inputs ?? {};
              const targetSha = await resolveDispatchedSha(inputs.commit_sha ?? "");
              if (!targetSha) {
                return;
              }
              core.setOutput("target_sha", targetSha);
              core.setOutput("verification_url", inputs.staging_verification_run_url ?? "");
              core.setOutput("tag_name", "");
              core.info(`resolved workflow_dispatch commit_sha to ${targetSha}`);
              return;
            }

            core.setOutput("target_sha", process.env.GITHUB_SHA);
            core.setOutput("verification_url", "");
            core.setOutput("tag_name", process.env.GITHUB_REF_NAME);

  release-production:
    needs: prepare
    runs-on: ubuntu-latest
    concurrency:
      group: online-release-production-environment
      cancel-in-progress: false
    steps:
      - name: Checkout target commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.target_sha }}

      - name: Confirm target commit is on origin/main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "${TARGET_SHA}" origin/main
          ./tools/dev/validate-release-commit-sha.sh "${TARGET_SHA}"
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}

      - name: Capture rollback backend SHA
        id: capture-previous
        run: |
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT
          if status=$(curl --silent --show-error --output "$response_file" --write-out '%{http_code}' --max-time 15 "${PRODUCTION_BACKEND_URL}/version"); then
            :
          else
            status=transport-error
          fi

          if [[ $status == 200 ]]; then
            previous_sha=$(jq -er 'if type == "object" and (keys == ["version_sha"]) and (.version_sha | type == "string") then .version_sha else empty end' "$response_file")
            previous_sha=$(./tools/dev/validate-release-commit-sha.sh "$previous_sha")
            source=serving-version
          elif [[ $status == 404 && "${GITHUB_EVENT_NAME}" == workflow_dispatch && -n "${PREVIOUS_COMMIT_SHA}" ]]; then
            previous_sha=$(./tools/dev/validate-release-commit-sha.sh "${PREVIOUS_COMMIT_SHA}")
            source=legacy-dispatch
          elif [[ $status == 404 ]]; then
            echo "serving backend does not provide /version; use workflow_dispatch with previous_commit_sha" >&2
            exit 1
          else
            echo "could not capture a valid serving backend version (HTTP status: $status)" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$previous_sha" origin/main; then
            echo "previous backend SHA is not reachable from origin/main" >&2
            exit 1
          fi

          {
            echo "previous_version_sha=$previous_sha"
            echo "previous_version_source=$source"
          } >> "$GITHUB_OUTPUT"
        env:
          PREVIOUS_COMMIT_SHA: ${{ inputs.previous_commit_sha }}

      - name: Apply production DB migrations
        run: make postgres-migrate-apply
        env:
          AI_ARENA_PG_MIGRATION_DSN: ${{ secrets.NEON_PRODUCTION_MIGRATION_DSN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: operator-ui/pnpm-lock.yaml

      - name: Install operator UI dependencies
        run: pnpm install --frozen-lockfile
        working-directory: operator-ui

      - name: Build operator UI
        run: pnpm run build
        working-directory: operator-ui
        env:
          VITE_OPERATOR_API_BASE_URL: ${{ env.PRODUCTION_BACKEND_URL }}

      - name: Deploy Pages production
        run: npx wrangler pages deploy dist --project-name="${CLOUDFLARE_PAGES_PROJECT}"
        working-directory: operator-ui
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Trigger target production Render deploy
        id: target-deploy
        continue-on-error: true
        run: |
          case "${RENDER_PRODUCTION_DEPLOY_HOOK_URL}" in
            *\?*) deploy_url="${RENDER_PRODUCTION_DEPLOY_HOOK_URL}&ref=${TARGET_SHA}" ;;
            *) deploy_url="${RENDER_PRODUCTION_DEPLOY_HOOK_URL}?ref=${TARGET_SHA}" ;;
          esac
          curl --fail --silent --show-error --request POST "${deploy_url}"
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}

      - name: Verify target backend version
        id: target-version
        if: ${{ steps.target-deploy.outcome == 'success' }}
        continue-on-error: true
        run: ./tools/dev/wait-for-remote-version.sh "${PRODUCTION_BACKEND_URL}" "${TARGET_SHA}"
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          REMOTE_VERSION_LABEL: Production target

      - name: Verify target backend worker readiness
        id: target-health
        if: ${{ steps.target-version.outcome == 'success' }}
        continue-on-error: true
        run: ./tools/dev/wait-for-remote-health.sh "${PRODUCTION_BACKEND_URL}"
        env:
          REMOTE_HEALTH_LABEL: Production target

      - name: Trigger previous backend rollback
        id: rollback-deploy
        if: ${{ always() && (steps.target-deploy.outcome != 'success' || steps.target-version.outcome != 'success' || steps.target-health.outcome != 'success') && steps.capture-previous.outputs.previous_version_sha != needs.prepare.outputs.target_sha }}
        continue-on-error: true
        run: |
          case "${RENDER_PRODUCTION_DEPLOY_HOOK_URL}" in
            *\?*) deploy_url="${RENDER_PRODUCTION_DEPLOY_HOOK_URL}&ref=${PREVIOUS_SHA}" ;;
            *) deploy_url="${RENDER_PRODUCTION_DEPLOY_HOOK_URL}?ref=${PREVIOUS_SHA}" ;;
          esac
          curl --fail --silent --show-error --request POST "${deploy_url}"
        env:
          RENDER_PRODUCTION_DEPLOY_HOOK_URL: ${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}
          PREVIOUS_SHA: ${{ steps.capture-previous.outputs.previous_version_sha }}

      - name: Verify rollback backend version
        id: rollback-version
        if: ${{ always() && steps.rollback-deploy.outcome == 'success' }}
        continue-on-error: true
        run: ./tools/dev/wait-for-remote-version.sh "${PRODUCTION_BACKEND_URL}" "${PREVIOUS_SHA}"
        env:
          PREVIOUS_SHA: ${{ steps.capture-previous.outputs.previous_version_sha }}
          REMOTE_VERSION_LABEL: Production rollback

      - name: Verify rollback backend worker readiness
        id: rollback-health
        if: ${{ always() && steps.rollback-version.outcome == 'success' }}
        continue-on-error: true
        run: ./tools/dev/wait-for-remote-health.sh "${PRODUCTION_BACKEND_URL}"
        env:
          REMOTE_HEALTH_LABEL: Production rollback

      - name: Write workflow summary
        if: ${{ always() }}
        run: |
          {
            echo "## Production release"
            echo
            echo "- Target commit SHA: \`${TARGET_SHA}\`"
            echo "- Previous backend SHA: \`${PREVIOUS_SHA:-unavailable}\` (${PREVIOUS_SOURCE:-unavailable})"
            if [ -n "${TAG_NAME}" ]; then
              echo "- Trigger tag: \`${TAG_NAME}\`"
            fi
            if [ -n "${STAGING_VERIFICATION_RUN_URL}" ]; then
              echo "- Staging verification: ${STAGING_VERIFICATION_RUN_URL}"
            fi
            echo "- Frontend URL: ${PRODUCTION_FRONTEND_URL}"
            echo "- Backend URL: ${PRODUCTION_BACKEND_URL}"
            echo "- DB migration: applied before Pages/Render deploy via \`NEON_PRODUCTION_MIGRATION_DSN\`"
            echo "- Target deploy: ${{ steps.target-deploy.outcome }}"
            echo "- Target version observation: HTTP ${{ steps.target-version.outputs.last_http_status || 'unavailable' }}, SHA \`${{ steps.target-version.outputs.last_version_sha || 'unavailable' }}\`"
            echo "- Target readiness observation: HTTP ${{ steps.target-health.outputs.last_http_status || 'unavailable' }}, api=\`${{ steps.target-health.outputs.last_api || 'unavailable' }}\`, worker=\`${{ steps.target-health.outputs.last_worker || 'unavailable' }}\`"
            echo "- Rollback deploy: ${{ steps.rollback-deploy.outcome == 'skipped' && 'not-attempted' || steps.rollback-deploy.outcome }}"
            echo "- Rollback version observation: HTTP ${{ steps.rollback-version.outputs.last_http_status || 'unavailable' }}, SHA \`${{ steps.rollback-version.outputs.last_version_sha || 'unavailable' }}\`"
            echo "- Rollback readiness observation: HTTP ${{ steps.rollback-health.outputs.last_http_status || 'unavailable' }}, api=\`${{ steps.rollback-health.outputs.last_api || 'unavailable' }}\`, worker=\`${{ steps.rollback-health.outputs.last_worker || 'unavailable' }}\`"
            echo "- Verification evidence: this workflow's target and rollback helper step logs"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          PREVIOUS_SHA: ${{ steps.capture-previous.outputs.previous_version_sha }}
          PREVIOUS_SOURCE: ${{ steps.capture-previous.outputs.previous_version_source }}
          STAGING_VERIFICATION_RUN_URL: ${{ needs.prepare.outputs.verification_url }}
          TAG_NAME: ${{ needs.prepare.outputs.tag_name }}

      - name: Mark target release failure
        if: ${{ always() && (steps.target-deploy.outcome != 'success' || steps.target-version.outcome != 'success' || steps.target-health.outcome != 'success') }}
        run: |
          echo "target backend was not accepted; inspect rollback evidence in the workflow summary" >&2
          exit 1
