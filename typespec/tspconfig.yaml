emit:
  - "@typespec/openapi3"
  - "@typespec/http-client-js"
options:
  "@typespec/openapi3":
    emitter-output-dir: "{project-root}/generated/openapi/operator"
    file-type: json
    output-file: openapi.json
  "@typespec/http-client-js":
    # Related upstream issue: https://github.com/microsoft/typespec/issues/8479
    # It covers empty-client generation generally; the JS TS6133 context output
    # remains unreported upstream as of 2026-09-16.
    # Keep the emitted client strict-TypeScript-safe. The current latest emitter
    # still emits unused contexts for empty clients; validate a candidate upgrade
    # by compiling the generated operator UI before replacing the temporary fix.
    emitter-output-dir: "{project-root}/../operator-ui/src/generated/operator-api"
    package-name: "@yoskeoka/ai-arena-operator-api"
